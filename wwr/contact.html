<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Superfast Whitewater Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
    <meta name="description" content="Contact Superfast Whitewater Rafting to book your next adventure or ask questions about our trips and services.">
    <meta name="author" content="Dallin Minnoch">
</head>

<body>
    <header>
        <img src="images/rapids.jpg" alt="Whitewater Rapids" class="logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>White Water Rafting Company</h1>

        <section class="contact-info">
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>

        <section class="contact-layout">
            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.019662027517!2d-122.41941508468132!3d37.77492927975983!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80858064df8a0e2b%3A0x4c8b7b3c9c6e7a0!2sSan%20Francisco!5e0!3m2!1sen!2sus!4v1610000000000"
                    width="600" height="450" allowfullscreen="" loading="lazy"></iframe>
            </div>

            <section class="contact-form">
                <form>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name">

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">

                    <p>Message Purpose</p>

                    <input type="radio" id="general" name="purpose" value="general">
                    <label for="general">General Inquiry</label>

                    <input type="radio" id="reservation" name="purpose" value="reservation">
                    <label for="reservation">Reservation Question</label>

                    <input type="radio" id="suggestion" name="purpose" value="suggestion">
                    <label for="suggestion">Website Suggestion</label>

                    <label for="message">Message</label>
                    <textarea id="message" name="message"></textarea>

                    <input type="checkbox" id="subscribe" name="subscribe">
                    <label for="subscribe">Please subscribe me to the monthly newsletter</label>

                    <button type="submit">Get in Touch!</button>
                </form>
            </section>
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <figure>
                <img src="images/man.jpg" alt="John Doe, Lead Rafting Guide">
                <figcaption>John Doe - Lead Rafting Guide</figcaption>
            </figure>

            <figure>
                <img src="images/woman.jpg" alt="Jane Doe, Safety Instructor">
                <figcaption>Jane Doe - Safety Instructor</figcaption>
            </figure>

            <figure>
                <img src="images/male.jpg" alt="Jake Doe, Trip Mapper">
                <figcaption>Jake Doe - Trip Mapper</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Superfast Whitewater Rafting. Dallin Minnoch.</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
