<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="styles/rafting.css">
    <meta name="description" content="Contact Superfast Whitewater Rafting to book your next adventure or ask any questions you may have about our trips and services. We’re here to help you plan an unforgettable rafting experience!">
    <meta name="author" content="Dallin Minnoch">
</head>

<body>
    <header>
        <img src="images/rapids.jpg" alt="Whitewater Rapids" class="logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
      <h1>Contact Us</h1>

      <section class="contact-info">
        <h2>Company Information</h2>
        <p><strong>Address:</strong> 909 Rafting Road, Raft City, USA</p>
        <p><strong>Phone:</strong> (555) 123-4567</p>
        <p><strong>Email:</strong> schedule@superfastrafting.com</p>
      </section>

      <section class="map">
        <h2>Find Us Here</h2>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.086123456789!2d-122.419415484681!3d37.7749297797596!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085809c12345678%3A0xabcdef1234567890!2s909%20Rafting%20Road%2C%20Raft%20City%2C%20USA!5e0!3m2!1sen!2s!4v1700000000000" 
        width="600" height="450" allowfullscreen="" loading="lazy">
      </iframe>
      </section>

      <section class="employees">
  <h2>Our Team</h2>
  <figure>
    <img src="images/employee1.jpg" alt="John Doe, Lead Rafting Guide">
    <figcaption>John Doe - Lead Rafting Guide</figcaption>
  </figure>
  <figure>
    <img src="images/employee2.jpg" alt="Jane Doe, Safety Instructor">
    <figcaption>Jane Doe - Safety Instructor</figcaption>
  </figure>
  <figure>
    <img src="images/employee3.jpg" alt="Jake Doe, Trip Mapper">
    <figcaption>Jake Doe - Trip Mapper</figcaption>
  </figure>
</section>

<section class="contact-form">
  <h2>Contact Form</h2>

  <form>

    <label for="name">Your Name:</label>
    <input type="text" id="name" name="name">

    <label for="email">Your Email:</label>
    <input type="email" id="email" name="email">

    <p>Purpose of Message:</p>

    <input type="radio" id="general" name="purpose" value="general">
    <label for="general">General Inquiry</label>

    <input type="radio" id="reservation" name="purpose" value="reservation">
    <label for="reservation">Reservation Question</label>

    <input type="radio" id="suggestion" name="purpose" value="suggestion">
    <label for="suggestion">Website Suggestion</label>

    <label for="message">Your Message:</label>
    <textarea id="message" name="message"></textarea>

    <input type="checkbox" id="subscribe" name="subscribe">
    <label for="subscribe">Please subscribe me to the monthly newsletter</label>

    <button type="submit">Send Message</button>

  </form>
</section>


    </main>
    <footer>
        <p>&copy; 2026 Superfast Whitewater Rafting. Dallin Minnoch.</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">

                <img src="images/linkedin.png" alt="LinkedIn Icon">
            </a> <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
